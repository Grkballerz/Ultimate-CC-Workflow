name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck install.sh scripts/smoke.sh dashboard/statusline.sh

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON manifests
        run: |
          set -e
          for f in .claude-plugin/*.json settings/*.json mcp/*.json; do
            [ -f "$f" ] || continue
            echo "checking $f"
            python -c "import json,sys; json.load(open('$f'))"
          done

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check . || echo "(format diffs allowed for now)"

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          pip install pytest
          sudo apt-get update -qq && sudo apt-get install -y jq
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/memory
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' -print -quit | grep -q .; then
            pytest -q tests
          else
            echo "no tests yet — skipping"
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-audit (clean repo must produce 0 critical)
        run: python3 bin/ucw-audit.py --repo .

  smoke:
    runs-on: ubuntu-latest
    needs: [pytest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y jq
      - name: End-to-end smoke
        run: ./scripts/smoke.sh
